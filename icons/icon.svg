<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#059669" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Stylized TEG Thermocouple Plates -->
  <rect x="96" y="112" width="320" height="28" rx="8" fill="url(#flameGrad)"/>
  <rect x="96" y="372" width="320" height="28" rx="8" fill="#0284c7"/>
  
  <!-- Semiconductor Couples -->
  <rect x="136" y="160" width="36" height="192" rx="6" fill="#f8fafc" opacity="0.9"/>
  <rect x="196" y="160" width="36" height="192" rx="6" fill="#38bdf8" opacity="0.85"/>
  <rect x="256" y="160" width="36" height="192" rx="6" fill="#f8fafc" opacity="0.9"/>
  <rect x="316" y="160" width="36" height="192" rx="6" fill="#38bdf8" opacity="0.85"/>

  <!-- Energy Harvest Lightning Bolt -->
  <path d="M280 180 L200 300 L260 300 L230 380 L320 260 L260 260 Z" fill="url(#boltGrad)" stroke="#064e3b" stroke-width="6" stroke-linejoin="round"/>
</svg>
